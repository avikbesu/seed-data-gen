# One-shot CSV generator (FORMAT=csv), parameterized by SYS. Run via
# `make seed SYS=<sys>`, or `SYS=<sys> docker compose -f
# config/docker/docker-compose.seed.yaml run --rm data-caterer` directly.
# No seed is set in any plan, so every run produces a different dataset.
#
# APPLICATION_CONFIG_PATH is what actually selects the plan
# (application.conf.template's planFilePath, rendered per-run).
# PLAN_FILE_PATH alone does NOT override that (confirmed) -- set anyway
# in case a future Data Caterer version honors it.
services:
  data-caterer:
    image: "datacatering/data-caterer:0.19.1"
    environment:
      APPLICATION_CONFIG_PATH: "/opt/app/custom/.rendered/application.conf"
      PLAN_FILE_PATH: "/opt/app/custom/.rendered/plan/${SYS:?SYS is required, e.g. SYS=banking}.yaml"
      ENABLE_GENERATE_DATA: "true"
      ENABLE_RECORD_TRACKING: "false"
      ENABLE_GENERATE_PLAN_AND_TASKS: "false"
      ENABLE_DELETE_GENERATED_RECORDS: "false"
      DRIVER_MEMORY: "2g"
      EXECUTOR_MEMORY: "2g"
      # Data Caterer's own log4j2.properties reads this directly
      # (rootLogger.level=${env:LOG_LEVEL:-info}) -- confirmed directly:
      # "warn" drops its noisy per-batch/per-sink [INFO ] lines while
      # still surfacing [WARN ]/[ERROR] and any failure's full stack
      # trace. Override per-run with `-e LOG_LEVEL=info` for full detail.
      LOG_LEVEL: "warn"
    volumes:
      - "../../data-caterer:/opt/app/custom"
      # CSVs land in the repo's data/${SYS}/ -- each step's options.csv.path
      # must use /opt/app/data/<sys>/... to match this mount.
      - "../../data/${SYS}:/opt/app/data/${SYS}"
