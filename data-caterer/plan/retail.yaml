# Simplified retail store sample data -- unified Data Caterer plan (see
# https://data.catering/0.19.1/ and docker/docker-compose.seed.yaml).
#
# Schema:
#   customer         -- one row per customer
#   supplier         -- external vendor supplying products to the store
#   product          -- one row per product, supplied by one supplier
#   employee         -- fixed 20-person staff roster (not a large pool)
#   shift_roster     -- each of the 20 employees works 5 shifts across
#                        the store's 7-day week (see that step's comment)
#   order            -- a customer buying products, processed by one
#                        employee
#   order_item       -- 1-5 product lines per order, deterministically,
#                        not via `foreignKeys` (see that step's comment)
#   invoice          -- 1:1 with order; amounts recomputed by
#                        postprocess/csv/retail.sh from order_item totals
#
# Date/timestamp fields are Australia/Sydney wall-clock time. No
# sinkOptions.seed is set -- every run produces a different dataset.
#
# Unlike banking.yaml, this plan uses NO `foreignKeys` block at all --
# every many-to-one reference is a deterministic hash of the row's own
# `seq` into the parent's `<PREFIX><8-digit-seq>` id format (different
# prime multipliers per field so pairings don't look cyclic), a matching
# `incremental` sequence for genuine 1:1s (invoice <-> order), or (for
# order_item's real one-to-many) a closed-form cumulative-sum encoding --
# see that step's own comment.
#
# order -> order_item originally tried real `foreignKeys` +
# `count.perField` (banking.yaml bug 2's fix). It does expand row count,
# but regardless of `count.records` or the `perField` range, the
# INDEX-BASED cardinality strategy only ever covered ~25-27% of the 2000
# orders (confirmed by testing several combinations) -- worse than
# banking's transactions, so order_item was redesigned with no
# `foreignKeys` at all instead, for real 1-5-item variety AND 100%
# coverage.
#
# A field's `sql` can only see other fields in its OWN row of its OWN
# step (same class of limitation as banking.yaml bug 5) -- so
# order_item.unit_price/invoice.subtotal_amount are generated as random
# placeholders here and corrected by postprocess/csv/retail.sh after
# generation.
#
# Verified directly against the real image (`make seed SYS=retail`), not
# assumed: every FK-shaped value resolves to a real parent row, row
# counts land where expected, and (after the postprocess script runs)
# every order_item's line_total matches its product's real price x
# quantity, and every invoice's subtotal_amount matches its order's real
# order_item sum.
version: "1.0"
name: "retail_sample_data"
description: "Simplified retail store sample data with intact customer/supplier/product/order relationships"

config:
  flags:
    enableGenerateData: true
    enableSaveReports: false
  generation:
    numRecordsPerBatch: 100000
  folders:
    generatedReportsFolderPath: "/opt/app/data/report"

dataSources:
  - name: "retail_csv"
    connection:
      type: "csv"
    steps:
      # ----- customer ------------------------------------------------------
      - name: "customer"
        options:
          path: "/opt/app/data/retail/customer.csv"
          header: true
        count:
          records: 300
        fields:
          - name: "seq"
            type: "long"
            options:
              incremental: 1
              omit: true
          - name: "id"
            options:
              sql: "CONCAT('CUS', LPAD(CAST(seq AS STRING), 8, '0'))"
          - name: "first_name"
            options:
              expression: "#{Name.firstName}"
          - name: "last_name"
            options:
              expression: "#{Name.lastName}"
          - name: "email"
            options:
              email: ""
          - name: "phone"
            options:
              phone: "AU"
          - name: "loyalty_tier_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "loyalty_tier"
            # weighted via a bucket + CASE, not `oneOf` -- see banking.yaml
            # bug 4 for why a weighted `oneOf` can't be trusted.
            options:
              sql: >-
                CASE
                  WHEN loyalty_tier_bucket < 0.4 THEN 'Bronze'
                  WHEN loyalty_tier_bucket < 0.7 THEN 'Silver'
                  WHEN loyalty_tier_bucket < 0.9 THEN 'Gold'
                  ELSE 'Platinum'
                END
          - name: "signup_date"
            type: "date"
            options:
              min: "2018-01-01"
              max: "2026-09-10"
          - name: "active_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "active"
            type: "boolean"
            options:
              sql: "CASE WHEN active_bucket < 0.9 THEN true ELSE false END"

      # ----- supplier ------------------------------------------------------
      # Renamed from an earlier "merchant" concept -- same field shape,
      # now explicitly an external vendor that supplies products (see
      # product.supplier_id below), not an internal store department.
      - name: "supplier"
        options:
          path: "/opt/app/data/retail/supplier.csv"
          header: true
        count:
          records: 40
        fields:
          - name: "seq"
            type: "long"
            options:
              incremental: 1
              omit: true
          - name: "id"
            options:
              sql: "CONCAT('SUP', LPAD(CAST(seq AS STRING), 8, '0'))"
          - name: "supplier_name"
            options:
              expression: "#{Company.name}"
          - name: "category_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "category"
            options:
              sql: >-
                CASE
                  WHEN category_bucket < 0.25 THEN 'Electronics'
                  WHEN category_bucket < 0.45 THEN 'Apparel'
                  WHEN category_bucket < 0.65 THEN 'Grocery'
                  WHEN category_bucket < 0.8 THEN 'Home & Garden'
                  WHEN category_bucket < 0.92 THEN 'Sports & Outdoors'
                  ELSE 'Electronics & Appliances'
                END
          - name: "contact_email"
            options:
              email: ""
          - name: "onboarded_date"
            type: "date"
            options:
              min: "2016-01-01"
              max: "2026-06-30"
          - name: "status_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "status"
            options:
              sql: "CASE WHEN status_bucket < 0.85 THEN 'Active' WHEN status_bucket < 0.95 THEN 'Suspended' ELSE 'Inactive' END"

      # ----- product -------------------------------------------------------
      # supplier_id: deterministic scattered pick across supplier's 40-row
      # range (see file-level comment). price is the source of truth
      # postprocess/csv/retail.sh uses to correct order_item.unit_price.
      - name: "product"
        options:
          path: "/opt/app/data/retail/product.csv"
          header: true
        count:
          records: 200
        fields:
          - name: "seq"
            type: "long"
            options:
              incremental: 1
              omit: true
          - name: "id"
            options:
              sql: "CONCAT('PRD', LPAD(CAST(seq AS STRING), 8, '0'))"
          - name: "product_name"
            options:
              expression: "#{Commerce.productName}"
          - name: "category_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "category"
            options:
              sql: >-
                CASE
                  WHEN category_bucket < 0.2 THEN 'Electronics'
                  WHEN category_bucket < 0.4 THEN 'Apparel'
                  WHEN category_bucket < 0.6 THEN 'Grocery'
                  WHEN category_bucket < 0.75 THEN 'Home & Garden'
                  WHEN category_bucket < 0.9 THEN 'Sports & Outdoors'
                  ELSE 'Toys & Games'
                END
          - name: "sku"
            options:
              regex: "SKU-[0-9]{6}"
              isUnique: true
          - name: "supplier_id"
            options:
              sql: "CONCAT('SUP', LPAD(CAST(((seq * 4001 + 977) % 40) + 1 AS STRING), 8, '0'))"
          - name: "price"
            type: "double"
            options:
              min: 5.00
              max: 500.00
          - name: "stock_quantity"
            type: "int"
            options:
              min: 0
              max: 500
          - name: "is_active_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "is_active"
            type: "boolean"
            options:
              sql: "CASE WHEN is_active_bucket < 0.9 THEN true ELSE false END"

      # ----- employee --------------------------------------------------------
      # A small, fixed 20-person staff roster (not a large pool -- see
      # shift_roster below, which schedules exactly these 20). No
      # supplier reference: suppliers are external vendors (see supplier
      # and product above), employees work for the store itself.
      - name: "employee"
        options:
          path: "/opt/app/data/retail/employee.csv"
          header: true
        count:
          records: 20
        fields:
          - name: "seq"
            type: "long"
            options:
              incremental: 1
              omit: true
          - name: "id"
            options:
              sql: "CONCAT('EMP', LPAD(CAST(seq AS STRING), 8, '0'))"
          - name: "first_name"
            options:
              expression: "#{Name.firstName}"
          - name: "last_name"
            options:
              expression: "#{Name.lastName}"
          - name: "email"
            options:
              email: ""
          - name: "role_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "role"
            options:
              sql: >-
                CASE
                  WHEN role_bucket < 0.4 THEN 'Sales Associate'
                  WHEN role_bucket < 0.65 THEN 'Cashier'
                  WHEN role_bucket < 0.85 THEN 'Stock Clerk'
                  WHEN role_bucket < 0.95 THEN 'Supervisor'
                  ELSE 'Manager'
                END
          - name: "hire_date"
            type: "date"
            options:
              min: "2016-01-01"
              max: "2026-06-30"
          - name: "employment_status_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "employment_status"
            options:
              sql: "CASE WHEN employment_status_bucket < 0.9 THEN 'Active' WHEN employment_status_bucket < 0.97 THEN 'On Leave' ELSE 'Terminated' END"

      # ----- shift_roster ------------------------------------------------
      # Exactly 20 employees x 5 shifts = 100 rows -- a fixed, deterministic
      # weekly roster, no `foreignKeys` needed.
      #
      # Date window: the 7 calendar days centered on CURRENT_DATE() (today
      # -3..+3). Store is open every day (day_offset covers all 7 values,
      # verified after generation). Each employee works exactly 5 of those
      # 7 days: `emp_idx (0-19) + shift_num (0-4), mod 7` gives 5
      # consecutive-mod-7 distinct days per employee (always unique, since
      # 5 consecutive integers mod 7 can't repeat), staggered by emp_idx
      # so employees don't all share the same days off.
      - name: "shift_roster"
        options:
          path: "/opt/app/data/retail/shift_roster.csv"
          header: true
        count:
          records: 100
        fields:
          - name: "row_seq"
            type: "long"
            options:
              incremental: 1
              omit: true
          - name: "id"
            options:
              sql: "CONCAT('SFT', LPAD(CAST(row_seq AS STRING), 10, '0'))"
          - name: "emp_idx"
            type: "long"
            options:
              omit: true
              sql: "(row_seq - 1) % 20"
          - name: "shift_num"
            type: "long"
            options:
              omit: true
              sql: "(row_seq - 1) DIV 20"
          - name: "employee_id"
            options:
              sql: "CONCAT('EMP', LPAD(CAST(emp_idx + 1 AS STRING), 8, '0'))"
          - name: "day_offset"
            type: "long"
            options:
              omit: true
              sql: "(emp_idx + shift_num) % 7"
          - name: "shift_date"
            type: "date"
            options:
              sql: "DATE_ADD(DATE_SUB(CURRENT_DATE(), 3), CAST(day_offset AS INT))"
          - name: "shift_type_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "shift_type"
            options:
              sql: >-
                CASE
                  WHEN shift_type_bucket < 0.3 THEN 'Morning'
                  WHEN shift_type_bucket < 0.6 THEN 'Afternoon'
                  WHEN shift_type_bucket < 0.85 THEN 'Evening'
                  ELSE 'Night'
                END
          - name: "shift_start"
            # fixed start/end per shift_type -- deterministic mapping, not
            # a separate random field, since real rosters use fixed shift
            # blocks.
            options:
              sql: >-
                CASE shift_type
                  WHEN 'Morning' THEN '06:00'
                  WHEN 'Afternoon' THEN '12:00'
                  WHEN 'Evening' THEN '17:00'
                  ELSE '22:00'
                END
          - name: "shift_end"
            options:
              sql: >-
                CASE shift_type
                  WHEN 'Morning' THEN '14:00'
                  WHEN 'Afternoon' THEN '20:00'
                  WHEN 'Evening' THEN '01:00'
                  ELSE '06:00'
                END
          - name: "status_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "status"
            options:
              sql: >-
                CASE
                  WHEN status_bucket < 0.75 THEN 'Completed'
                  WHEN status_bucket < 0.9 THEN 'Scheduled'
                  WHEN status_bucket < 0.97 THEN 'No-Show'
                  ELSE 'Cancelled'
                END

      # ----- order -----------------------------------------------------
      # customer_id and employee_id are both scattered deterministic
      # picks (different prime multipliers so the pairing doesn't look
      # like a fixed repeating cycle) -- not `foreignKeys`, per the
      # file-level comment. employee_id is who processed/handled the
      # order (e.g. the cashier who rang it up), not a purchasing agent.
      # No amount field here -- an order's real total is the sum of its
      # order_item lines, owned by invoice.subtotal_amount after
      # postprocess/csv/retail.sh runs (see order_item and invoice below).
      - name: "order"
        options:
          path: "/opt/app/data/retail/order.csv"
          header: true
        count:
          records: 2000
        fields:
          - name: "seq"
            type: "long"
            options:
              incremental: 1
              omit: true
          - name: "id"
            options:
              sql: "CONCAT('ORD', LPAD(CAST(seq AS STRING), 10, '0'))"
          - name: "customer_id"
            options:
              sql: "CONCAT('CUS', LPAD(CAST(((seq * 4001 + 977) % 300) + 1 AS STRING), 8, '0'))"
          - name: "employee_id"
            options:
              sql: "CONCAT('EMP', LPAD(CAST(((seq * 6007 + 311) % 20) + 1 AS STRING), 8, '0'))"
          - name: "order_date"
            type: "timestamp"
            options:
              min: "2024-01-01 00:00:00"
              max: "2026-09-10 23:59:59"
          - name: "order_status_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "order_status"
            options:
              sql: >-
                CASE
                  WHEN order_status_bucket < 0.55 THEN 'Delivered'
                  WHEN order_status_bucket < 0.7 THEN 'Shipped'
                  WHEN order_status_bucket < 0.85 THEN 'Confirmed'
                  WHEN order_status_bucket < 0.92 THEN 'Pending'
                  WHEN order_status_bucket < 0.97 THEN 'Cancelled'
                  ELSE 'Returned'
                END
          - name: "currency_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "currency"
            options:
              sql: >-
                CASE
                  WHEN currency_bucket < 0.6 THEN 'AUD'
                  WHEN currency_bucket < 0.75 THEN 'USD'
                  WHEN currency_bucket < 0.88 THEN 'GBP'
                  ELSE 'EUR'
                END
          - name: "payment_method_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "payment_method"
            options:
              sql: >-
                CASE
                  WHEN payment_method_bucket < 0.5 THEN 'Credit Card'
                  WHEN payment_method_bucket < 0.75 THEN 'Debit Card'
                  WHEN payment_method_bucket < 0.9 THEN 'Digital Wallet'
                  ELSE 'Cash'
                END

      # ----- order_item ----------------------------------------------------
      # 1-5 product lines per order, deterministically -- see the
      # file-level comment for why not via `foreignKeys` + `count.perField`.
      #
      # items-per-order is `((order_seq - 1) % 5) + 1`: 400 orders get 1
      # item, 400 get 2, ..., 400 get 5 (period-5 cycle, 1+2+3+4+5=15
      # rows/cycle). row_seq (1..6000, 400 cycles x 15 rows) decodes back
      # into (which order, which item) via cycle_index/offset_in_cycle/
      # order_pos_in_cycle below -- the inverse of that cumulative-sum
      # pattern. Every order gets exactly its assigned item count -- 100%
      # coverage, verified after generation.
      #
      # unit_price/line_total are random placeholders (sql can't reach
      # product.price -- file-level comment), corrected by
      # postprocess/csv/retail.sh after generation.
      - name: "order_item"
        options:
          path: "/opt/app/data/retail/order_item.csv"
          header: true
        count:
          records: 6000
        fields:
          - name: "row_seq"
            type: "long"
            options:
              incremental: 1
              omit: true
          - name: "id"
            options:
              sql: "CONCAT('ITM', LPAD(CAST(row_seq AS STRING), 10, '0'))"
          - name: "cycle_index"
            type: "long"
            options:
              omit: true
              sql: "(row_seq - 1) DIV 15"
          - name: "offset_in_cycle"
            type: "long"
            options:
              omit: true
              sql: "(row_seq - 1) % 15"
          - name: "order_pos_in_cycle"
            # Which of the 5 orders in this cycle (0-4) this row belongs
            # to -- cumulative boundaries for weights 1,2,3,4,5 are
            # [0,1) [1,3) [3,6) [6,10) [10,15).
            type: "long"
            options:
              omit: true
              sql: >-
                CASE
                  WHEN offset_in_cycle < 1 THEN 0
                  WHEN offset_in_cycle < 3 THEN 1
                  WHEN offset_in_cycle < 6 THEN 2
                  WHEN offset_in_cycle < 10 THEN 3
                  ELSE 4
                END
          - name: "item_idx"
            # 1-based line number within this row's order (1st, 2nd, ...
            # item of that order) -- offset_in_cycle minus that
            # order_pos_in_cycle's cumulative start.
            type: "long"
            options:
              sql: >-
                CASE order_pos_in_cycle
                  WHEN 0 THEN offset_in_cycle - 0
                  WHEN 1 THEN offset_in_cycle - 1
                  WHEN 2 THEN offset_in_cycle - 3
                  WHEN 3 THEN offset_in_cycle - 6
                  ELSE offset_in_cycle - 10
                END + 1
          - name: "order_id"
            options:
              sql: "CONCAT('ORD', LPAD(CAST(cycle_index * 5 + order_pos_in_cycle + 1 AS STRING), 10, '0'))"
          - name: "product_id"
            options:
              sql: "CONCAT('PRD', LPAD(CAST(((row_seq * 4001 + 977) % 200) + 1 AS STRING), 8, '0'))"
          - name: "quantity"
            type: "int"
            options:
              min: 1
              max: 5
          - name: "unit_price"
            type: "double"
            options:
              min: 5.00
              max: 500.00
          - name: "line_total"
            type: "double"
            options:
              sql: "ROUND(quantity * unit_price, 2)"

      # ----- invoice -----------------------------------------------------
      # 1:1 with order via a matching `incremental` sequence (both fixed
      # at 2000 rows) -- same technique as party <-> party_contact in
      # banking.yaml, not `foreignKeys`. subtotal_amount/tax_amount/
      # total_amount are independently-random placeholders here -- see
      # file-level comment for why -- corrected by postprocess/csv/retail.sh
      # from order_item's real totals after generation. tax_rate and
      # payment_status/paid_date are left as generated (not derived from
      # anything else).
      - name: "invoice"
        options:
          path: "/opt/app/data/retail/invoice.csv"
          header: true
        count:
          records: 2000
        fields:
          - name: "seq"
            type: "long"
            options:
              incremental: 1
              omit: true
          - name: "id"
            options:
              sql: "CONCAT('INV', LPAD(CAST(seq AS STRING), 10, '0'))"
          - name: "order_id"
            options:
              sql: "CONCAT('ORD', LPAD(CAST(seq AS STRING), 10, '0'))"
          - name: "invoice_date"
            type: "date"
            options:
              min: "2024-01-01"
              max: "2026-09-10"
          - name: "due_date"
            type: "date"
            options:
              sql: "DATE_ADD(invoice_date, 14)"
          - name: "subtotal_amount"
            type: "double"
            options:
              min: 5.00
              max: 2000.00
          - name: "tax_rate_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "tax_rate"
            type: "double"
            options:
              sql: >-
                CASE
                  WHEN tax_rate_bucket < 0.7 THEN 0.10
                  WHEN tax_rate_bucket < 0.85 THEN 0.05
                  ELSE 0.0
                END
          - name: "tax_amount"
            type: "double"
            options:
              sql: "ROUND(subtotal_amount * tax_rate, 2)"
          - name: "total_amount"
            type: "double"
            options:
              sql: "ROUND(subtotal_amount + tax_amount, 2)"
          - name: "payment_status_bucket"
            type: "double"
            options:
              omit: true
              min: 0.0
              max: 1.0
          - name: "payment_status"
            options:
              sql: >-
                CASE
                  WHEN payment_status_bucket < 0.7 THEN 'Paid'
                  WHEN payment_status_bucket < 0.85 THEN 'Pending'
                  WHEN payment_status_bucket < 0.95 THEN 'Overdue'
                  ELSE 'Refunded'
                END
          - name: "paid_date"
            type: "date"
            options:
              sql: "CASE WHEN payment_status = 'Paid' THEN DATE_ADD(invoice_date, CAST(RAND() * 14 AS INT)) ELSE NULL END"
