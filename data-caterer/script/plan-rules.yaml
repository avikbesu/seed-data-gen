# Declarative rules for validate_plan.py. Each rule encodes either a
# confirmed Data Caterer 0.19.1 bug or a plan convention -- see
# CONTRIBUTING.md's "Writing a plan file" section for the human-readable
# checklist and each plan's header comment for the bug writeups.
# Line-ban rules are pure regex and need no engine change to add/edit;
# the other rule kinds are parameterized versions of a fixed check (e.g.
# "a field name suffix implies a type+options shape") -- adding a new
# rule of an existing kind is still just YAML, a genuinely new kind of
# check needs a matching function in validate_plan.py.
#
# Parsed by plan_yaml.py -- a hand-rolled loader for this repo's own YAML
# subset, not a general parser. Keep authoring within that subset: 2-space
# block indent, flow-style [a, b] lists, quoted or plain scalars. See
# plan_yaml.py's own header comment for exactly what it supports.

required_top_level_keys: ["version", "name", "description", "config", "dataSources"]

required_datasource_keys: ["name", "steps"]

required_step_keys: ["count", "fields"]

line_bans:
  - id: "no-yaml-anchor"
    on: "raw"
    pattern: "(^|[^\"$&*A-Za-z0-9_.])&[A-Za-z_][A-Za-z0-9_]*"
    exclude_pattern: "\"[^\"]*&[^\"]*\""
    message: "YAML anchor ('&name') found -- Data Caterer's parser rejects anchors/aliases; write the fields out in full instead (see banking.yaml header comment)"

  - id: "no-yaml-alias"
    on: "trimmed"
    pattern: "^[A-Za-z0-9_]+: *\\*[A-Za-z_]"
    message: "YAML alias ('*name') found -- Data Caterer's parser rejects anchors/aliases"

  - id: "no-cardinality"
    on: "trimmed"
    pattern: "^cardinality:"
    message: "'cardinality' is banned -- confirmed no-op under foreignKeys (Data Caterer 0.19.1 bug); use count.perField"

  - id: "no-weighted-oneof"
    on: "trimmed"
    pattern: "->[0-9]"
    message: "weighted oneOf syntax ('value->N') is banned -- confirmed broken (always returns the last alternative); use a hidden _bucket double + sql CASE instead"

  - id: "no-static-seed"
    on: "trimmed"
    pattern: "^seed:"
    message: "'seed:' found -- this repo's plans intentionally omit sinkOptions.seed so every run generates fresh data; remove it (or update this rule if a plan now wants one)"

path_prefix:
  key: "path"
  template: "/opt/app/data/{sys}/"
  message: "path \"{value}\" does not start with \"{expected}\" (required by the volume mount in config/docker/docker-compose.seed.yaml)"

field_suffix_conventions:
  - id: "bucket-field-convention"
    suffix: "_bucket"
    require_type: "double"
    require_options:
      omit: "true"
      min: "0.0"
      max: "1.0"
    message: "field '{field}' looks like a bucket helper (name ends in {suffix}) but isn't 'type: \"{require_type}\"' with 'omit: true', 'min: 0.0', 'max: 1.0' -- see any existing *_bucket field for the pattern"

type_construct_conflicts:
  - id: "boolean-oneof-conflict"
    type: "boolean"
    forbidden_construct: "oneOf"
    message: "field '{field}' is 'type: \"boolean\"' but uses 'oneOf' -- oneOf always generates a string column (confirmed Data Caterer 0.19.1 behavior); type it \"string\" or derive the boolean via sql instead"

duplicate_foreign_key_targets:
  enabled: true
  message: "a second 'foreignKeys' entry targets step '{step}' (first targeted at line {first_line}) -- confirmed only the first populates real parent values, the rest fall back to random defaults (banking.yaml bug 1)"

literal_field_name_collision:
  enabled: true
  message: "field '{field}' has a string literal '{literal}' that collides with sibling field name '{literal}' in the same step -- confirmed to corrupt the literal at generation time; rename one of them (see banking.yaml bug 6)"

foreign_key_field_references:
  enabled: true
  bad_datasource_message: "foreignKeys {kind} references dataSource '{value}', which isn't declared by any dataSources[].name in this plan"
  bad_step_message: "foreignKeys {kind} references step '{value}', which isn't declared under dataSource '{datasource}'"
  bad_field_message: "foreignKeys {kind} references field '{value}', which isn't declared in step '{step}'"

dual_format_options:
  enabled: true
  registry: "config/generator/common/datasources.yaml"
  missing_format_message: "step '{step}' has no 'options.{format}' block -- every format declared in {registry} (currently: {formats}) is required on every step, see CONTRIBUTING.md's \"Writing a plan file\""
  missing_key_message: "step '{step}' options.{format} is missing required key '{key}' (see {registry})"
